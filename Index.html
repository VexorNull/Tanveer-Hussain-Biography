<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Tanveer Hussain's Biography...</title>
    <link rel="icon" type="image/png" href="https://vexornull.github.io/favicon/favicon.png">
    <!-- Instant Meta Redirect -->
    <meta http-equiv="refresh" content="0; url=https://vexornull.github.io/Tanveer-Hussain-Biography/about/">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .redirect-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- JavaScript Fallback Redirect -->
    <script>
        window.location.href = "https://vexornull.github.io/Tanveer-Hussain-Biography/about/";
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h2>Redirecting...</h2>
        <p>Taking you to Tanveer Hussain's official biography page.</p>
        <p>If you are not redirected automatically, <a href="https://vexornull.github.io/Tanveer-Hussain-Biography/about/">click here</a>.</p>
    </div>
</body>
</html>
