<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Primary SEO & Redirect Control -->
    <title>Redirecting to Tanveer Hussain's Biography...</title>
    <meta name="description" content="Official biography page redirect for Tanveer Hussain (@VexorNull).">
    <meta name="author" content="Tanveer Hussain">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://vexornull.github.io/Tanveer-Hussain-Biography/about/">
<link rel="robots" href="/robots.txt">
    <!-- Instant Meta Redirect to /about/ -->
    <meta http-equiv="refresh" content="0; url=https://vexornull.github.io/Tanveer-Hussain-Biography/about/">

    <!-- Open Graph / Social Media Preview (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vexornull.github.io/Tanveer-Hussain-Biography/about/">
    <meta property="og:title" content="Tanveer Hussain's Official Biography">
    <meta property="og:description" content="Click here to view the official biography and portfolio of Tanveer Hussain (@VexorNull).">
    <meta property="og:image" content="https://vexornull.github.io/Tanveer-Hussain-Biography/about/thumbnail.jpg">
    <meta property="og:site_name" content="Tanveer Hussain">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://vexornull.github.io/Tanveer-Hussain-Biography/about/">
    <meta name="twitter:title" content="Tanveer Hussain's Official Biography">
    <meta name="twitter:description" content="Click here to view the official biography and portfolio of Tanveer Hussain.">
    <meta name="twitter:image" content="https://vexornull.github.io/Tanveer-Hussain-Biography/about/thumbnail.jpg">
    <meta name="twitter:creator" content="@VexorNull">

    <!-- Theme & App Colors -->
    <meta name="theme-color" content="#0f172a">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .redirect-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- JavaScript Fallback Redirect -->
    <script>
        window.location.href = "https://vexornull.github.io/Tanveer-Hussain-Biography/about/";
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h2>Redirecting...</h2>
        <p>Taking you to Tanveer Hussain's official biography page.</p>
        <p>If you are not redirected automatically, <a href="https://vexornull.github.io/Tanveer-Hussain-Biography/about/">click here</a>.</p>
    </div>
</body>
</html>
